<ol class="moments">
  <include src="components/story/moment.html"
    number="i."
    title="East Egg &amp; West Egg"
    caption="Long Island · A dinner · A green light"
    text="Nick takes a job in New York and rents a cottage on West Egg, next door to Gatsby's mansion. Across the bay in East Egg, where old money lives, he has dinner with his cousin Daisy, her husband Tom and her friend Jordan. Tom's mistress calls twice during the meal. At home, Nick sees Gatsby on his lawn, arms stretched toward a green light across the water."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="The Valley of Ashes"
    caption="Between the Eggs and the city · Tom's secret"
    text="Tom introduces Nick to his mistress, Myrtle Wilson, who lives in the Valley of Ashes, an industrial wasteland halfway to New York. Her husband George owns a garage and does not know why Tom visits. At the love nest in the city, a party ends when Tom breaks Myrtle's nose for repeating Daisy's name."></include>
  <include src="components/story/moment.html"
    number="iii."
    title="Gatsby's parties"
    caption="West Egg · A search for the host"
    text="Nick is formally invited to one of Gatsby's parties, and goes with Jordan to find the host. They meet an owl-eyed man in the library but no Gatsby. At around midnight Gatsby introduces himself, then takes Jordan aside to tell her something amazing."></include>
  <include src="components/story/moment.html"
    number="iv."
    title="Gatsby's secret"
    caption="A yellow car · A lunch · Five years ago"
    text="Gatsby drives Nick to the city in his big yellow car and tells him his life story, which sounds like a lie until he produces a medal and a photograph. At lunch he introduces Meyer Wolfsheim, his shady business partner. Jordan then tells Nick the truth: five years ago in Louisville, Daisy and a young officer named Jay Gatsby fell in love. He bought the mansion to be near her, and throws his parties hoping she will come."></include>
  <include src="components/story/moment.html"
    number="v."
    title="Tea &amp; a reunion"
    caption="Nick's cottage · Awkward, then not"
    text="Gatsby asks Nick to invite Daisy to tea without telling her he will be there. He arrives an hour early, then runs out the back door and knocks at the front as if he had just arrived. The reunion is awkward, until Daisy and Gatsby are absorbed in one another. Gatsby takes them next door to tour his house, and Nick leaves them to it."></include>
  <include src="components/story/moment.html"
    number="vi."
    title="James Gatz"
    caption="Before West Egg · A new name"
    text="Gatsby was born James Gatz, the son of poor Midwestern farmers. At seventeen he reinvented himself, and his career began when he introduced himself as Jay Gatsby to the millionaire Dan Cody. Cody became his employer and mentor."></include>
</ol>
