<ol class="moments">
  <include src="components/story/moment.html"
    number="i."
    title="Tom sniffs it out"
    caption="A Sunday visit · A party · A lunch"
    text="Tom and his riding friends drop in on Gatsby as if his house were a pub, and Gatsby makes a point of telling Tom, “I know your wife.” Tom and Daisy attend Gatsby's next party, where Daisy is miserable and Tom vows to find out who Gatsby really is. At a lunch at the Buchanans', Tom sees the affair for himself."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="The Plaza Hotel"
    caption="The city · A confrontation"
    text="Tom and Gatsby swap cars on the drive to the city. At the Plaza Hotel, Tom confronts Gatsby, and Daisy loses her nerve to leave her marriage. Tom reveals that Gatsby makes his money from organised crime with Wolfsheim. Gatsby tries to deny it, but Daisy shuts down and says she wants to go home."></include>
  <include src="components/story/moment.html"
    number="iii."
    title="The yellow car"
    caption="Wilson's garage · A death on the road"
    text="Myrtle runs into the road to flag down Gatsby's big yellow car, and it does not stop. She is killed instantly. Later, Gatsby tells Nick that Daisy was driving, but that he will say he was. He waits all night in the garden to protect her, and she and Tom are left talking together, almost as if they were conspiring."></include>
  <include src="components/story/moment.html"
    number="iv."
    title="The pool"
    caption="West Egg · The afternoon after"
    text="George Wilson, deranged with grief, goes looking for the owner of the yellow car, and someone gives him Gatsby's name. He reaches the mansion at about three in the afternoon and finds Gatsby in his pool. Nick arrives too late and finds Gatsby dead on his pool mattress, with Wilson's body in the grass nearby."></include>
  <include src="components/story/moment.html"
    number="v."
    title="After the funeral"
    caption="Nobody comes · Nick goes home"
    text="With no word from Daisy and a cowardly refusal from Wolfsheim, Nick becomes Gatsby's champion. Gatsby's father arrives from Minnesota, still proud of his son. Of all Gatsby's guests, only the owl-eyed man from the library attends the funeral. Nick returns to the Midwest, refuses to shake Tom's hand, and learns that Tom was the one who gave Wilson Gatsby's name."></include>
  <include src="components/story/moment.html"
    number="vi."
    title="The green light"
    caption="Gatsby's beach · The last night"
    text="On his last night, Nick sits on Gatsby's beach and looks across the bay. He imagines how hopeful Gatsby felt seeing the green light at the end of Daisy's dock, and how he failed to see that his dream belonged to the past. We are all, he thinks, like boats beating against a current."></include>
</ol>
