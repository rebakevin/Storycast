  <include src="components/story/moment.html"
    number="i."
    title="Circe's island"
    caption="Aeaea · A feast · A year"
    text="On the island of Aeaea, the witch goddess Circe feeds a scouting party and turns every one of them into a pig. Hermes gives Odysseus a plant called moly that blocks her magic. Her spell fails, she frees his men, and they stay on the island for a year while Penelope waits at home."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="The land of the dead"
    caption="The edge of the world · A warning · His mother"
    text="Circe tells him he must first speak to the prophet Tiresias. Odysseus sails to the edge of the world, digs a pit, fills it with blood and summons the dead. Tiresias warns him never to touch the cattle of the sun god Helios. Odysseus also sees his mother, who died of grief waiting for him, and three times she slips through his arms like a shadow."></include>
</ol>
