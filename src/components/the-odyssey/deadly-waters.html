<ol class="moments">
  <include src="components/story/moment.html"
    number="i."
    title="The Sirens"
    caption="Beautiful voices · Beeswax and a mast"
    text="The Sirens' voices lure sailors onto the rocks. Odysseus has his crew plug their ears with beeswax and tie him to the mast, so that he can hear the song without steering toward it."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="Scylla &amp; Charybdis"
    caption="A narrow strait · No safe path"
    text="A six-headed monster waits on one side and a great whirlpool on the other. Odysseus chooses Scylla, knowing it will cost him six men rather than the whole ship."></include>
  <include src="components/story/moment.html"
    number="iii."
    title="The cattle of the sun"
    caption="Thrinacia · Starving · A thunderbolt"
    text="Bad winds trap the ship on the island of the sun god's sacred cattle until the food runs out. While Odysseus sleeps, his crew slaughter the cattle. The moment they sail, Zeus splits the ship with a thunderbolt. Every man drowns except Odysseus, who clings to the wreckage."></include>
  <include src="components/story/moment.html"
    number="iv."
    title="Calypso &amp; Phaeacia"
    caption="Seven years · A raft · A ship home"
    text="The sea washes Odysseus onto the island of the goddess Calypso. She offers him immortality, but he sits on the beach for seven years, crying and staring at the horizon. At last Athena persuades Zeus to intervene. Odysseus builds a raft, Poseidon smashes it, and the king of Phaeacia gives him a ship. He wakes on the beach of Ithaca twenty years after he left."></include>
</ol>
