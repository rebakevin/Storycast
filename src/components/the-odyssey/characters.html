<section class="characters" aria-labelledby="characters-title-odyssey">
  <div class="characters__inner">
    <h2 class="characters__title" id="characters-title-odyssey">Meet the <em>characters</em></h2>

    <ol class="characters__list">
      <include src="components/story/character.html"
        number="I"
        name="Odysseus"
        role="The king"
        text="King of Ithaca and the cleverest man in Greece. He outwits a Cyclops and survives the sirens, but his pride keeps him at sea for ten years."></include>
      <include src="components/story/character.html"
        number="II"
        name="Penelope"
        role="The wife"
        text="Odysseus's wife. For twenty years she waits, holding off a hall of suitors by weaving a shroud by day and unravelling it by night."></include>
      <include src="components/story/character.html"
        number="III"
        name="Telemachus"
        role="The son"
        text="Odysseus's son, grown up in his father's absence. When the king returns, he fights beside him in the great hall."></include>
      <include src="components/story/character.html"
        number="IV"
        name="Polyphemus"
        role="The Cyclops"
        text="A one-eyed giant and son of Poseidon. Blinded by Odysseus, he prays to his father for a curse that follows the king across the sea."></include>
      <include src="components/story/character.html"
        number="V"
        name="Athena"
        role="The protector"
        text="The goddess who pleads with Zeus to let Odysseus go home, and who disguises him as a beggar so he can enter his own palace."></include>
    </ol>
  </div>
</section>
