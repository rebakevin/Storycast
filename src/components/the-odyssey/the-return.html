<ol class="moments">
  <include src="components/story/moment.html"
    number="i."
    title="A palace full of suitors"
    caption="Ithaca · 108 men · A shroud"
    text="Over a hundred men have moved into Odysseus's palace, eating his food and pressing Penelope to marry one of them. She has stalled for years by promising to choose once she finishes a burial shroud, weaving by day and unravelling by night. Athena disguises Odysseus as an old beggar so he can walk in unrecognised."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="Argos"
    caption="The gate · A dog that waited"
    text="At the gate, an ancient dog lying on a pile of manure lifts his head. It is Argos, the hunting dog Odysseus raised as a puppy. The dog wags his tail, lays his ears flat and dies. He had waited twenty years to see his master once more."></include>
  <include src="components/story/moment.html"
    number="iii."
    title="The bow"
    caption="The great hall · Twelve axes"
    text="The suitors mock the beggar and throw food at him. Penelope sets a contest: whoever strings Odysseus's great bow and shoots an arrow through twelve axe heads wins her hand. No suitor can even bend it. The beggar strings it, fires cleanly through all twelve, and turns the bow on the suitors. With Telemachus beside him, he kills them all."></include>
  <include src="components/story/moment.html"
    number="iv."
    title="The bed"
    caption="Penelope's last test"
    text="Twenty years is a long time, and Penelope is not yet convinced. She tells her servants to move the king's bed out of the bedroom. Odysseus answers that it cannot be moved: he built it around a living olive tree, and one of its posts is the tree itself. Only the real Odysseus could know that. Penelope breaks down, and they are reunited."></include>
</ol>
