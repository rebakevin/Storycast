<ol class="moments">
  <include src="components/story/moment.html"
    number="i."
    title="Ismarus &amp; the Lotus Eaters"
    caption="Day one · A storm · Forgotten homes"
    text="Odysseus raids the city of Ismarus, but his men stay on the beach to feast instead of leaving. The Cicones return and kill 72 of them. A storm then blows the fleet to the Lotus Eaters, where anyone who eats the lotus forgets their home and family."></include>
  <include src="components/story/moment.html"
    number="ii."
    title="The Cyclops"
    caption="Polyphemus's cave · “My name is Nobody”"
    text="Odysseus and twelve men are trapped in a cave by a one-eyed giant who eats two of them each morning. Odysseus gets Polyphemus drunk, tells him his name is Nobody, and drives a burning stake into his eye. When the other Cyclopes ask who is hurting him, he answers, “Nobody.” The men escape strapped under the bellies of his sheep."></include>
  <include src="components/story/moment.html"
    number="iii."
    title="A name shouted"
    caption="The sea · Poseidon's curse"
    text="Odysseus could simply have sailed away. Instead he shouts his real name at the blinded giant. Polyphemus prays to his father Poseidon that Odysseus never reach home, or arrive late, broken and alone. From that moment the sea itself is his enemy."></include>
  <include src="components/story/moment.html"
    number="iv."
    title="The bag of winds"
    caption="Aeolus · Ithaca in sight"
    text="Aeolus, king of the winds, seals the dangerous winds in a leather bag and sends a gentle wind home. For nine days it works, and on the tenth Ithaca appears. Odysseus falls asleep, his crew open the bag, and the winds blow every ship back across the sea."></include>
  <include src="components/story/moment.html"
    number="v."
    title="The Laestrygonians"
    caption="A harbour of giants · Twelve ships become one"
    text="Giants attack from the cliffs, hurling boulders and spearing sailors like fish. Eleven of the twelve ships are destroyed. Only Odysseus's ship, moored outside the harbour, escapes."></include>
</ol>
