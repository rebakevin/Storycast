<li class="story-card-slot">
  <article class="story-card">
    <div>
      <span class="story-card__number">{{ number }}</span>
      <h3 class="story-card__title">{{ title }}</h3>
    </div>
    <div>
      <p class="story-card__summary">{{ summary }}</p>
      <p class="story-card__formats">{{ formats }}</p>
      <p class="story-card__status">Coming soon</p>
    </div>
  </article>
</li>
