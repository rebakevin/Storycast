<li class="scene">
  <figure class="scene__figure">
    <include src="components/ui/lovers.html"
      montague="{{ montague }}"
      capulet="{{ capulet }}"
      label="{{ label }}"></include>
    <figcaption class="scene__caption">{{ caption }}</figcaption>
  </figure>
  <article class="scene__body">
    <span class="scene__number">{{ number }}</span>
    <h2 class="scene__title">{{ title }}</h2>
    <p class="scene__text">{{ text }}</p>
  </article>
</li>
